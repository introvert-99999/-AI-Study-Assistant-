<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Study Assistant</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top">
    <h1>Study Assistant</h1>
    <div class="row">
      <button id="settingsBtn" class="ghost" type="button" aria-expanded="false" aria-controls="settings">Settings</button>
      <button id="themeBtn" class="ghost" type="button" aria-label="Toggle dark mode">Dark</button>
    </div>
  </header>

  <main>
    <section id="settings" class="card" hidden>
      <h2>API key</h2>
      <p class="muted">Free key from <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>. It is stored only in this browser (localStorage) and sent only to Google.</p>
      <div class="row">
        <label class="sr" for="keyInput">Gemini API key</label>
        <input id="keyInput" type="password" autocomplete="off" placeholder="Paste your Gemini API key">
        <button id="saveKey" type="button">Save key</button>
        <button id="removeKey" class="ghost" type="button">Remove key</button>
      </div>
    </section>

    <section class="card">
      <h2>Your notes</h2>
      <label for="notes">Paste class notes, or type a topic like "photosynthesis"</label>
      <textarea id="notes" rows="8"></textarea>
      <p id="count" class="muted">0 / 8000 characters</p>
      <div class="row">
        <label>Summary style
          <select id="style">
            <option value="simple, as if explaining to a 10-year-old">Explain like I am 10</option>
            <option value="exam-focused, with key terms and definitions" selected>Exam-focused</option>
            <option value="detailed and thorough">Detailed</option>
          </select>
        </label>
        <label>Quiz difficulty
          <select id="level"><option>easy</option><option selected>medium</option><option>hard</option></select>
        </label>
      </div>
      <button id="generate" type="button">Generate study material</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section id="results" class="card" hidden>
      <div id="tabs" class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="summary" type="button">Summary</button>
        <button class="tab" role="tab" data-tab="quiz" type="button">Quiz</button>
        <button class="tab" role="tab" data-tab="cards" type="button">Flashcards</button>
      </div>
      <div id="panel-summary" class="panel">
        <div id="summary"></div>
        <div class="row">
          <button id="copy" class="ghost" type="button">Copy</button>
          <button id="download" class="ghost" type="button">Download .txt</button>
          <button id="speak" class="ghost" type="button">Read aloud</button>
        </div>
      </div>
      <div id="panel-quiz" class="panel" hidden><div id="quiz"></div></div>
      <div id="panel-cards" class="panel" hidden>
        <p class="muted">Click a card to flip it.</p>
        <div id="cards" class="grid"></div>
      </div>
    </section>

    <section class="card">
      <div class="row between">
        <h2>History</h2>
        <button id="clearHist" class="ghost" type="button" hidden>Delete all history</button>
      </div>
      <ul id="history" class="history"></ul>
    </section>
  </main>
</body>
</html>
